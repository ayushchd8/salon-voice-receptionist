services:
  db:
    image: postgres:16-alpine
    container_name: salon_db
    environment:
      POSTGRES_USER: salon
      POSTGRES_PASSWORD: salon
      POSTGRES_DB: salon
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - salon_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salon -d salon"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  salon_pgdata:
